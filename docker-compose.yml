# Variables communes à toutes les API .NET
x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Development

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: repairit_keycloak
    # Importe les fichiers de /opt/keycloak/data/import au démarrage (ignoré si le realm existe déjà)
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Issuer des tokens identique depuis le navigateur et depuis les conteneurs
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro

  auth-service:
    build: { context: ., dockerfile: docker/Dockerfile.api, args: { PROJECT: RepairIT.AuthentificationService } }
    container_name: repairit_auth
    environment:
      <<: *api-env
      Keycloak__BaseUrl: http://keycloak:8080/
    ports: [ "5240:8080" ]
    depends_on: [ keycloak ]

  user-service:
    build: { context: ., dockerfile: docker/Dockerfile.api, args: { PROJECT: RepairIT.UserService } }
    container_name: repairit_user
    environment: *api-env
    ports: [ "5101:8080" ]

  catalog-service:
    build: { context: ., dockerfile: docker/Dockerfile.api, args: { PROJECT: RepairIT.CatalogService } }
    container_name: repairit_catalog
    environment: *api-env
    ports: [ "5102:8080" ]

  customer-service:
    build: { context: ., dockerfile: docker/Dockerfile.api, args: { PROJECT: RepairIT.CustomerService } }
    container_name: repairit_customer
    environment: *api-env
    ports: [ "5103:8080" ]

  repair-service:
    build: { context: ., dockerfile: docker/Dockerfile.api, args: { PROJECT: RepairIT.RepairService } }
    container_name: repairit_repair
    environment: *api-env
    ports: [ "5104:8080" ]

  sales-service:
    build: { context: ., dockerfile: docker/Dockerfile.api, args: { PROJECT: RepairIT.SalesService } }
    container_name: repairit_sales
    environment: *api-env
    ports: [ "5105:8080" ]

  gateway:
    build: { context: ., dockerfile: docker/Dockerfile.api, args: { PROJECT: RepairIT.Gateway } }
    container_name: repairit_gateway
    environment:
      <<: *api-env
      # Dans Docker, chaque service est joint par son nom de service, sur le port 8080
      ReverseProxy__Clusters__auth__Destinations__default__Address: http://auth-service:8080/
      ReverseProxy__Clusters__users__Destinations__default__Address: http://user-service:8080/
      ReverseProxy__Clusters__catalog__Destinations__default__Address: http://catalog-service:8080/
      ReverseProxy__Clusters__customers__Destinations__default__Address: http://customer-service:8080/
      ReverseProxy__Clusters__repairs__Destinations__default__Address: http://repair-service:8080/
      ReverseProxy__Clusters__sales__Destinations__default__Address: http://sales-service:8080/
    ports: [ "5010:8080" ]
    depends_on: [ auth-service, user-service, catalog-service, customer-service, repair-service, sales-service ]

  client:
    build: { context: ., dockerfile: docker/Dockerfile.client }
    container_name: repairit_client
    ports: [ "5000:5000" ]
    depends_on: [ gateway ]